<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#02040a">
<title>KAELITH69</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#02040a;color:#fff;overflow-x:hidden;font-family:system-ui,sans-serif}body{height:900vh}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#loader{position:fixed;inset:0;background:#02040a;z-index:4;display:grid;place-items:center;transition:opacity 1s}#loader.hide{opacity:0;pointer-events:none}.loader-sun{width:18px;height:18px;border-radius:50%;background:#fff2c5;box-shadow:0 0 18px 8px #ffbd5b,0 0 80px 35px #ff6b18;position:absolute}.loader-orbit{position:absolute;border:1px solid #263341;border-radius:50%;animation:spin linear infinite}.loader-orbit:after{content:"";position:absolute;top:0;left:50%;width:4px;height:4px;background:#cbdff5;border-radius:50%}.o1{width:45px;height:45px;animation-duration:.4s}.o2{width:75px;height:75px;animation-duration:.6s}.o3{width:110px;height:110px;animation-duration:.8s}.o4{width:150px;height:150px;animation-duration:1s}.o5{width:190px;height:190px;animation-duration:1.2s}.o6{width:235px;height:235px;animation-duration:1.4s}.o7{width:280px;height:280px;animation-duration:1.6s}.o8{width:325px;height:325px;animation-duration:1.8s}@keyframes spin{to{transform:rotate(360deg)}}#name{position:fixed;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(24px,6vw,78px);letter-spacing:.22em;font-weight:300;white-space:nowrap;opacity:0;pointer-events:none;text-shadow:0 0 30px #c7e4ff;transition:opacity .8s}#name.show{opacity:1}#hint{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);font:10px monospace;letter-spacing:.18em;color:#94a8bd;z-index:2;opacity:.7;transition:opacity .5s}#hint.hide{opacity:0}@media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}

#controls{position:fixed;z-index:3;left:50%;bottom:64px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;max-width:95vw;overflow-x:auto;padding:8px 12px;background:rgba(4,10,20,.48);border:1px solid rgba(140,190,255,.13);border-radius:40px;backdrop-filter:blur(14px);opacity:0;transition:opacity .8s}
#controls.show{opacity:1}
.planet-btn{background:transparent;border:0;color:#9fb4ca;font:10px monospace;letter-spacing:.1em;padding:9px 10px;cursor:pointer;white-space:nowrap;transition:color .25s,background .25s;border-radius:20px}
.planet-btn:hover,.planet-btn.active{color:#fff;background:rgba(100,160,255,.16)}
#timebar{position:fixed;z-index:3;right:22px;top:22px;display:flex;align-items:center;gap:10px;color:#8da3bb;font:10px monospace;letter-spacing:.12em;opacity:0;transition:opacity .8s}
#timebar.show{opacity:1}#speed{width:100px;accent-color:#91c9ff}
#planet-label{position:fixed;z-index:2;left:28px;top:50%;transform:translateY(-50%);font:12px monospace;letter-spacing:.24em;color:#c8d9ed;opacity:0;transition:opacity .4s;text-shadow:0 0 16px #4b8cff}
#planet-label.show{opacity:.85}
@media(max-width:600px){#controls{bottom:46px;gap:2px;padding:5px} .planet-btn{padding:8px 7px;font-size:9px}#timebar{top:14px;right:14px}#planet-label{left:14px;font-size:10px}}
</style>
</head>
<body><canvas id="space"></canvas><div id="loader"><div class="loader-sun"></div><div class="loader-orbit o1"></div><div class="loader-orbit o2"></div><div class="loader-orbit o3"></div><div class="loader-orbit o4"></div><div class="loader-orbit o5"></div><div class="loader-orbit o6"></div><div class="loader-orbit o7"></div><div class="loader-orbit o8"></div></div><div id="name">KAELITH69</div><div id="hint">SCROLL TO TRAVEL</div><div id="planet-label"></div><div id="timebar"><span>TIME</span><input id="speed" type="range" min="0" max="4" step=".01" value="1"><span id="speed-value">1×</span></div><nav id="controls"></nav>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const canvas=document.querySelector('#space'),loader=document.querySelector('#loader'),name=document.querySelector('#name'),hint=document.querySelector('#hint'),controls=document.querySelector('#controls'),planetLabel=document.querySelector('#planet-label'),speedInput=document.querySelector('#speed'),speedValue=document.querySelector('#speed-value'),timebar=document.querySelector('#timebar');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02040a);scene.fog=new THREE.FogExp2(0x02040a,.0015);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.01,5000);camera.position.set(0,24,100);
const clock=new THREE.Clock();const system=new THREE.Group();scene.add(system);
const starGeo=new THREE.BufferGeometry(),starPos=[];for(let i=0;i<16000;i++){starPos.push((Math.random()-.5)*2400,(Math.random()-.5)*2400,(Math.random()-.5)*2400)}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xc8d8eb,size:.65,sizeAttenuation:true,transparent:true,opacity:.85})));
const texLoader=new THREE.TextureLoader();const tex=(file)=>{const t=texLoader.load('https://www.solarsystemscope.com/textures/download/'+file);t.colorSpace=THREE.SRGBColorSpace;return t};
const sun=new THREE.Mesh(new THREE.SphereGeometry(5,96,96),new THREE.MeshBasicMaterial({map:tex('2k_sun.jpg')}));system.add(sun);const light=new THREE.PointLight(0xffffff,2600,0,2);light.position.set(0,0,0);system.add(light);
const glowCanvas=document.createElement('canvas');glowCanvas.width=glowCanvas.height=256;const ctx=glowCanvas.getContext('2d');const grad=ctx.createRadialGradient(128,128,4,128,128,128);grad.addColorStop(0,'rgba(255,240,180,.95)');grad.addColorStop(.2,'rgba(255,170,70,.3)');grad.addColorStop(1,'rgba(255,100,10,0)');ctx.fillStyle=grad;ctx.fillRect(0,0,256,256);const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(glowCanvas),blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));glow.scale.set(38,38,1);sun.add(glow);
const specs=[
['Mercury',.19,9,.24,'2k_mercury.jpg',.03],['Venus',.47,14,.62,'2k_venus_surface.jpg',.03],['Earth',.5,20,1,'2k_earth_daymap.jpg',.0001],['Mars',.27,27,1.88,'2k_mars.jpg',.03],['Jupiter',3.8,38,11.86,'2k_jupiter.jpg',.03],['Saturn',3.2,52,29.46,'2k_saturn.jpg',.03],['Uranus',1.8,66,84.01,'2k_uranus.jpg',.03],['Neptune',1.75,80,164.8,'2k_neptune.jpg',.03],['Pluto',.1,92,248,'2k_pluto.jpg',.03]
];
const bodies=[];let selectedPlanet=null,timeScale=1;const orbitLine=(r)=>{const points=[];for(let i=0;i<=360;i++){const a=i*Math.PI/180;points.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r))}const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineBasicMaterial({color:0x64798e,transparent:true,opacity:.13}));system.add(line)};
specs.forEach((s,i)=>{const [n,r,d,period,file,tilt]=s;orbitLine(d);const pivot=new THREE.Group();system.add(pivot);const mesh=new THREE.Mesh(new THREE.SphereGeometry(r,64,64),new THREE.MeshStandardMaterial({map:tex(file),roughness:.95}));mesh.position.x=d;mesh.rotation.z=tilt;mesh.userData={spin:1/(r+1)*.12};pivot.add(mesh);bodies.push({name:n,pivot,mesh,d,period,phase:i*.7});const btn=document.createElement('button');btn.className='planet-btn';btn.textContent=n.toUpperCase();btn.onclick=()=>focusPlanet(n);controls.appendChild(btn);if(n==='Earth'){const cloudTex=tex('2k_earth_clouds.jpg');const cloud=new THREE.Mesh(new THREE.SphereGeometry(r*1.012,64,64),new THREE.MeshStandardMaterial({map:cloudTex,transparent:true,opacity:.38,depthWrite:false}));mesh.add(cloud);const atmo=new THREE.Mesh(new THREE.SphereGeometry(r*1.035,64,64),new THREE.MeshBasicMaterial({color:0x3a9bff,transparent:true,opacity:.09,side:THREE.BackSide}));mesh.add(atmo);}});
const sat=bodies.find(b=>b.name==='Saturn');const ringTex=texLoader.load('https://www.solarsystemscope.com/textures/download/2k_saturn_ring_alpha.png');const ring=new THREE.Mesh(new THREE.RingGeometry(4.2,7.1,180),new THREE.MeshStandardMaterial({map:ringTex,transparent:true,opacity:.88,side:THREE.DoubleSide,roughness:1}));ring.rotation.x=Math.PI/2.15;sat.mesh.add(ring);
const earth=bodies.find(b=>b.name==='Earth');
const start=new THREE.Vector3(0,24,100),overview=new THREE.Vector3(0,15,145),earthClose=new THREE.Vector3(20,3,22),indiaClose=new THREE.Vector3(20,.5,9);
function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}
function mix(a,b,t){return a.clone().lerp(b,smooth(t))}
function cameraTarget(p){if(p<.16)return {pos:mix(start,overview,p/.16),target:new THREE.Vector3()};if(p<.42)return {pos:mix(overview,earthClose,(p-.16)/.26),target:earth.mesh.getWorldPosition(new THREE.Vector3())};if(p<.65)return {pos:mix(earthClose,indiaClose,(p-.42)/.23),target:earth.mesh.getWorldPosition(new THREE.Vector3())};return {pos:indiaClose.clone().multiplyScalar(1-(p-.65)/.35).add(new THREE.Vector3(0,0,4)),target:earth.mesh.getWorldPosition(new THREE.Vector3())}}
function focusPlanet(n){selectedPlanet=n;planetLabel.textContent=n.toUpperCase();planetLabel.classList.add('show');document.querySelectorAll('.planet-btn').forEach(x=>x.classList.toggle('active',x.textContent===n.toUpperCase()));const b=bodies.find(x=>x.name===n);const p=b.mesh.getWorldPosition(new THREE.Vector3());camera.position.copy(p).add(new THREE.Vector3(b.d*.18,Math.max(b.d*.06,2),Math.max(b.mesh.geometry.parameters.radius*4,b.d*.12)));camera.lookAt(p);scroll=.45;window.scrollTo({top:document.body.scrollHeight*.45,behavior:'smooth'});}
speedInput.addEventListener('input',()=>{timeScale=Number(speedInput.value);speedValue.textContent=timeScale.toFixed(1)+'×';});
let scroll=0;addEventListener('scroll',()=>{scroll=scroll/(document.body.scrollHeight-innerHeight);scroll=window.scrollY/(document.body.scrollHeight-innerHeight);hintFade()}, {passive:true});
function hintFade(){hint.classList.toggle('hide',scroll>.03)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
setTimeout(()=>{loader.classList.add('hide');name.classList.add('show');controls.classList.add('show');timebar.classList.add('show');setTimeout(()=>name.classList.remove('show'),2200)},2200);
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime()*timeScale;sun.rotation.y=t*.06;bodies.forEach(b=>{b.pivot.rotation.y=t*.008/(b.period**.25);b.mesh.rotation.y=t*b.mesh.userData.spin});system.rotation.y=t*.015;const state=cameraTarget(scroll);camera.position.lerp(state.pos,.035);camera.lookAt(state.target);renderer.render(scene,camera)}animate();
</script></body></html>
