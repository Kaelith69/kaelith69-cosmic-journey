<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Connect with KAELITH69">
<title>Contact | KAELITH69</title>
<style>
:root{
  color-scheme:light;
  --cobalt:#F1EBDD;
  --blue:#244BFF;
  --navy:#171717;
  --cyan:#FF4D00;
  --lime:#D9F04A;
  --magenta:#E83F78;
  --white:#F1EBDD;
  --pale:#C8C2B5;
  --display:Impact,"Arial Narrow",sans-serif;
  --body:Arial,Helvetica,sans-serif;
  --gutter:clamp(22px,6vw,92px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--cobalt);color:var(--navy);font-family:var(--body);overflow-x:hidden}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--blue);outline-offset:5px}
::selection{background:var(--blue);color:var(--white)}
.site-header{height:72px;padding:0 var(--gutter);display:flex;align-items:center;justify-content:space-between;position:absolute;inset:0 0 auto;z-index:5}
.wordmark{font:900 17px/1 var(--body);letter-spacing:-.01em}
.nav{display:flex;align-items:center;gap:clamp(20px,4vw,58px);font-size:12px;font-weight:700}
.nav a{transition:color .2s}
.nav a:hover{color:var(--cyan)}
.nav .nav-contact{background:var(--navy);color:var(--white);padding:12px 16px;display:inline-flex;align-items:center;gap:9px}
.hero{min-height:850px;height:100svh;max-height:1100px;position:relative;display:flex;align-items:center;padding:120px var(--gutter) 80px;overflow:hidden;isolation:isolate;background:var(--cobalt)}
.hero::before{content:"";position:absolute;z-index:-2;width:min(69vw,920px);aspect-ratio:1;border-radius:50%;background:var(--blue);right:-17%;top:8%;clip-path:circle(50%); }
.hero::after{content:"";position:absolute;z-index:-1;width:min(51vw,680px);aspect-ratio:1;border:2px solid var(--white);border-radius:50%;right:-7%;top:18%;box-shadow:0 0 0 22px transparent,0 0 0 24px rgba(23,23,23,.18);animation:orbit 70s linear infinite;pointer-events:none}
.hero-content{width:100%;position:relative;isolation:isolate}
.hero h1{font:900 clamp(92px,18.5vw,270px)/.72 var(--display);letter-spacing:-.02em;margin:0;text-transform:uppercase;position:relative;z-index:1}
.hero h1 span{display:block;color:var(--cyan);margin-left:clamp(26px,11vw,170px)}
.hero-disc{position:absolute;width:clamp(150px,22vw,320px);aspect-ratio:1;border-radius:50%;background:var(--magenta);right:clamp(3%,12vw,180px);top:50%;transform:translateY(-42%);mix-blend-mode:normal;z-index:-1}
.hero-disc::before{content:"";position:absolute;inset:13%;border:2px solid var(--navy);border-radius:50%}
.hero-disc::after{content:"";position:absolute;width:18%;aspect-ratio:1;background:var(--lime);border-radius:50%;right:9%;top:17%}
.hero-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;margin:clamp(48px,8vh,90px) 0 0 clamp(4px,1vw,16px);max-width:900px;position:relative;z-index:2}
.hero-bottom p{font-size:clamp(15px,1.4vw,19px);line-height:1.55;max-width:380px;margin:0;color:var(--navy)}
.hero-link{font-size:12px;font-weight:800;letter-spacing:.04em;border-bottom:2px solid var(--cyan);padding:0 0 8px;white-space:nowrap}
.hero-link .icon{color:var(--cyan);width:17px;height:17px;margin-left:14px;vertical-align:middle;transition:transform .2s}
.hero-link:hover .icon{transform:translate(3px,3px)}
.icon{display:inline-block;width:18px;height:18px;flex:none;vertical-align:middle}
.icon-link{display:inline-flex;align-items:center;gap:10px}
.icon-link .brand-icon{width:19px;height:19px}
.icon-link .out-icon{width:13px;height:13px;opacity:.75}
.work{background:var(--navy);color:var(--white);padding:clamp(88px,11vw,160px) var(--gutter) 130px;position:relative;overflow:hidden}
.work::before{content:"";position:absolute;width:34vw;aspect-ratio:1;border-radius:50%;background:var(--blue);right:-17vw;top:-17vw}
.section-heading{font:900 clamp(76px,14vw,190px)/.76 var(--display);letter-spacing:-.015em;text-transform:uppercase;margin:0 0 clamp(64px,9vw,120px);position:relative;z-index:1}
.section-heading span{color:var(--cyan)}
.project-list{position:relative;z-index:1;border-top:1px solid rgba(241,235,221,.5)}
.project{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(240px,.8fr) 42px;align-items:center;gap:clamp(20px,4vw,60px);padding:30px 0 34px;border-bottom:1px solid rgba(241,235,221,.35);transition:padding .25s}
.project:hover{padding-left:16px;padding-right:8px}
.project h3{font:900 clamp(42px,7vw,88px)/.9 var(--display);letter-spacing:-.01em;text-transform:uppercase;margin:0}
.project-copy p{font-size:14px;line-height:1.55;color:rgba(241,235,221,.9);margin:0 0 12px;max-width:520px}
.project-tech{font-size:10px;line-height:1.5;font-weight:700;letter-spacing:.06em;color:var(--lime);text-transform:uppercase}
.project-arrow{width:42px;height:42px;display:grid;place-items:center;background:var(--blue);color:var(--white);transition:transform .25s,background .25s}
.project-arrow svg{width:21px;height:21px}
.project:hover .project-arrow{transform:rotate(45deg);background:var(--magenta)}
.more-work{display:inline-block;margin-top:30px;padding-bottom:7px;border-bottom:1px solid var(--lime);font-size:12px;font-weight:700}
.about{min-height:620px;background:var(--blue);padding:clamp(100px,13vw,180px) var(--gutter);position:relative;overflow:hidden;display:grid;grid-template-columns:1.1fr .9fr;gap:8vw;align-items:center}
.about::before{content:"";position:absolute;width:min(55vw,720px);aspect-ratio:1;border-radius:50%;background:var(--navy);right:-20%;top:50%;transform:translateY(-50%)}
.about::after{content:"";position:absolute;width:min(35vw,450px);aspect-ratio:1;border:34px solid var(--magenta);border-radius:50%;right:-8%;top:50%;transform:translateY(-50%)}
.about h2{font:900 clamp(64px,10vw,138px)/.8 var(--display);letter-spacing:-.015em;text-transform:uppercase;margin:0;position:relative;z-index:1}
.about h2 span{color:var(--lime);display:block}
.about-copy{max-width:430px;position:relative;z-index:1}
.about-copy p{font-size:clamp(17px,1.8vw,22px);line-height:1.65;color:var(--white);margin:0}
.contact{background:var(--cobalt);color:var(--navy);padding:clamp(90px,12vw,160px) var(--gutter) 54px;position:relative;overflow:hidden}
.contact::before{content:"";position:absolute;width:min(52vw,680px);aspect-ratio:1;border-radius:50%;background:var(--lime);right:-19%;top:-38%;opacity:.95}
.contact::after{content:"";position:absolute;width:min(34vw,440px);aspect-ratio:1;border:30px solid var(--magenta);border-radius:50%;right:-7%;top:-14%}
.contact-inner{position:relative;z-index:1}
.contact h2{font:900 clamp(88px,17vw,230px)/.72 var(--display);letter-spacing:-.02em;text-transform:uppercase;margin:0 0 70px}
.contact h2 span{display:block;margin-left:clamp(24px,12vw,180px);color:var(--blue)}
.contact-links{display:flex;gap:28px;flex-wrap:wrap;border-top:2px solid rgba(23,23,23,.55);padding-top:22px;max-width:720px}
.contact-links a{font-size:13px;font-weight:800;border-bottom:1px solid transparent;padding-bottom:5px}
.contact-links a:hover{border-color:var(--cyan);color:var(--cyan)}
.footer{background:var(--navy);padding:22px var(--gutter);display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:11px;color:var(--pale)}
.footer a{color:var(--white)}
.footer a:hover{color:var(--lime)}
@keyframes orbit{to{transform:translateX(48%) rotate(360deg)}}
@media(max-width:760px){
 .site-header{height:64px}.nav{gap:16px;font-size:11px}
 .hero{min-height:760px;padding-top:110px}.hero::before{width:100vw;right:-45%;top:18%}.hero::after{width:70vw;right:-23%;top:23%}
 .hero h1{font-size:clamp(82px,20vw,150px)}.hero h1 span{margin-left:7vw}
 .hero-disc{width:34vw;right:8%;top:42%}.hero-bottom{align-items:flex-start;flex-direction:column;margin-top:60px}
 .work{padding-top:100px;padding-bottom:90px}.section-heading{font-size:clamp(76px,17vw,130px);margin-bottom:70px}
 .project{grid-template-columns:1fr 38px;gap:18px;padding:26px 0}.project h3{font-size:clamp(48px,11vw,72px)}.project-copy{grid-column:1;grid-row:2}.project-arrow{grid-column:2;grid-row:1}
 .about{grid-template-columns:1fr;gap:40px;min-height:600px}.about::before{width:90vw;right:-50%;top:58%}.about::after{width:62vw;right:-25%;top:58%;border-width:20px}
 .about h2{font-size:clamp(72px,15vw,110px)}.about-copy{max-width:500px}
 .contact::before{width:75vw;right:-38%;top:-12%}.contact::after{width:48vw;right:-14%;top:0;border-width:18px}
 .contact h2{font-size:clamp(86px,19vw,150px);margin-bottom:56px}
}
@media(max-width:420px){
 .nav{gap:12px}.nav a{font-size:10px}.nav .nav-contact{padding:10px}
 .hero{min-height:700px}.hero h1{font-size:20vw}.hero-bottom{margin-top:48px}
 .project h3{font-size:48px}.contact h2{font-size:19vw}
 .footer{align-items:flex-start;flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* Record shop */
.record-shop{
  --shop-paper:#F1EBDD;
  --shop-ink:#171717;
  --shop-blue:#244BFF;
  --shop-orange:#FF4D00;
  --shop-lime:#D9F04A;
  --shop-pink:#E83F78;
  background:var(--shop-ink);
  color:var(--shop-paper);
  padding:clamp(76px,9vw,124px) var(--gutter) clamp(70px,8vw,110px);
  overflow:hidden;
}
.record-shop::before{display:none}
.record-shop-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:34px;
  margin-bottom:34px;
  position:relative;
  z-index:1;
}
.record-shop-title{
  margin:0;
  font:900 clamp(64px,10.5vw,142px)/.78 var(--display);
  letter-spacing:-.025em;
  text-transform:uppercase;
}
.record-shop-title span{color:var(--shop-orange)}
.record-controls{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:8px;
  max-width:510px;
}
.record-controls input,.record-controls select{
  height:42px;
  min-width:0;
  padding:0 12px;
  border:1px solid rgba(241,235,221,.38);
  border-radius:0;
  outline:none;
  background:#242424;
  color:var(--shop-paper);
  font:700 11px var(--body);
}
.record-controls input{width:210px}
.record-controls select{max-width:155px}
.record-controls input:focus,.record-controls select:focus{
  outline:2px solid var(--shop-lime);
  outline-offset:2px;
}
.record-count{
  margin:0 0 16px;
  color:var(--shop-lime);
  font:700 10px var(--body);
  letter-spacing:.13em;
}
.record-wall{
  position:relative;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  align-items:start;
  gap:clamp(28px,3.2vw,46px) clamp(22px,2.8vw,38px);
  padding:clamp(26px,3.5vw,46px);
  border:1px solid #51483d;
  background:linear-gradient(180deg,#302c27 0%,#211f1c 76%,#171717 100%);
  box-shadow:inset 0 1px rgba(255,255,255,.09),0 20px 40px rgba(0,0,0,.24);
  isolation:isolate;
}
.record-wall::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 48px,rgba(241,235,221,.025) 49px,transparent 50px),linear-gradient(90deg,rgba(255,255,255,.035),transparent 12%,transparent 88%,rgba(0,0,0,.16));
}
.record-unit{
  position:relative;
  z-index:1;
  min-width:0;
  aspect-ratio:.82;
  isolation:isolate;
}
.record-unit:has(.record-sleeve.is-selected){z-index:5}
.record-sleeve{
  --sleeve:#244BFF;
  --sleeve-ink:#F1EBDD;
  --disc-label:#FF4D00;
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  padding:0;
  border:0;
  background:transparent;
  color:var(--sleeve-ink);
  cursor:pointer;
  isolation:isolate;
  transform:translateY(0);
  transition:transform .32s ease,filter .32s ease;
}
.record-sleeve-face{
  position:absolute;
  inset:0;
  z-index:3;
  display:block;
  overflow:hidden;
  border:1px solid rgba(0,0,0,.55);
  background:var(--sleeve);
  box-shadow:0 8px 14px rgba(0,0,0,.38),inset 4px 0 rgba(255,255,255,.12),inset -4px 0 rgba(0,0,0,.18);
  transition:box-shadow .38s ease;
}
.record-sleeve-face::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.15),transparent 26%,transparent 70%,rgba(0,0,0,.18));
}
.record-sleeve-face::after{
  content:"";
  position:absolute;
  inset:5.5%;
  border:1px solid var(--sleeve-ink);
  opacity:.48;
  pointer-events:none;
}
.record-art{
  position:absolute;
  inset:9% 9% 29%;
  display:block;
  overflow:hidden;
  background:var(--sleeve-ink);
}
.record-art::before,.record-art::after{
  content:"";
  position:absolute;
  display:block;
}
.record-art::before{
  width:76%;
  aspect-ratio:1;
  left:12%;
  top:12%;
  border-radius:50%;
  background:var(--sleeve);
  box-shadow:0 0 0 2px var(--sleeve-ink),0 0 0 8px var(--sleeve);
}
.record-art::after{
  width:22%;
  height:135%;
  left:39%;
  top:-17%;
  background:var(--sleeve);
  transform:rotate(36deg);
  mix-blend-mode:multiply;
}
.record-style-1 .record-art{background:var(--sleeve)}
.record-style-1 .record-art::before{
  width:110%;
  left:-5%;
  top:18%;
  border-radius:0;
  background:var(--sleeve-ink);
  box-shadow:none;
  transform:rotate(-28deg);
}
.record-style-1 .record-art::after{
  width:28%;
  left:36%;
  background:var(--sleeve-ink);
  transform:none;
}
.record-style-2 .record-art{
  border:clamp(7px,.8vw,12px) solid var(--sleeve-ink);
  border-radius:50%;
  background:transparent;
}
.record-style-2 .record-art::before{
  width:48%;
  left:26%;
  top:26%;
  background:var(--sleeve);
  box-shadow:0 0 0 7px var(--sleeve-ink);
}
.record-style-2 .record-art::after{
  width:18%;
  left:41%;
  background:var(--sleeve);
  transform:rotate(48deg);
}
.record-style-3 .record-art{background:var(--sleeve-ink)}
.record-style-3 .record-art::before{
  width:68%;
  left:16%;
  top:16%;
  border-radius:0;
  background:var(--sleeve);
  box-shadow:none;
  transform:rotate(45deg);
}
.record-style-3 .record-art::after{
  width:24%;
  left:38%;
  background:var(--sleeve);

      if (next) next(); else hide();
      running = false;
    },COMPLETE_HOLD_MS);
  };

  const pageFor = url => url.pathname.split("/").pop() || "index.html";
  const isLocalPage = url => url.origin === location.origin && pageNames.includes(pageFor(url));
  const expected = location.pathname + location.search + location.hash;
  let stored = null;
  try { stored = sessionStorage.getItem(destinationKey); } catch (_) {}
  if (stored === expected) {
    try { sessionStorage.removeItem(destinationKey); } catch (_) {}
    hide();
  } else run();

  document.addEventListener("click",event => {
    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const link = event.target.closest("a[href]");
    if (!link || link.target === "_blank" || link.hasAttribute("download")) return;
    let url;
    try { url = new URL(link.href,location.href); } catch (_) { return; }
    if (!isLocalPage(url)) return;
    if (url.pathname === location.pathname && url.search === location.search) {
      if (!url.hash || url.hash === location.hash) return;
      event.preventDefault();
      run(() => {
        history.pushState({pageTransition:true},"",url.href);
        const target = document.getElementById(decodeURIComponent(url.hash.slice(1)));
        if (target) target.scrollIntoView({behavior:"auto",block:"start"});
        hide();
      });
      return;
    }
    event.preventDefault();
    run(() => {
      try { sessionStorage.setItem(destinationKey,url.pathname + url.search + url.hash); } catch (_) {}
      location.assign(url.href);
    });
  });

  window.addEventListener("pageshow",event => { if (event.persisted) run(); });
  window.addEventListener("popstate",() => {
    run(() => {
      if (location.hash) {
        const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (target) target.scrollIntoView({behavior:"auto",block:"start"});
      }
      hide();
    });
  });
})();
</script>
</body></html>
